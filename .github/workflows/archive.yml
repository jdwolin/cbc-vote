name: Archive votes
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: archive
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/archive.py
      - run: |
          if ! git diff --quiet archive.json; then
            git config user.name "vote-archiver"; git config user.email "actions@users.noreply.github.com"
            git add archive.json && git commit -m "Archive votes" && git push
          fi
